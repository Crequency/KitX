name: "Pull Request Labeler"
on:
    # pull_request_target runs in the base repository context, so the token is
    # not downgraded to read-only for pull requests coming from forks.
    # This workflow only calls the API. Never check out or run code from the PR here.
    pull_request_target:
        types:
            - closed

permissions:
    contents: read
    pull-requests: write

jobs:
    pr-merged:
        if: github.event.pull_request.merged == true
        runs-on: ubuntu-latest
        steps:
            - uses: actions/github-script@v7
              with:
                  script: |
                      await github.rest.issues.addLabels({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        labels: ["merged"]
                      })
